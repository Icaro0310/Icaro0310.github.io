<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devin-office — kanban demo (synthetic data)</title>
<meta name="description" content="Session kanban of devin-office: cards move across RUNNING, BLOCKED, REVIEW and CLOSED columns. Demo mode uses synthetic data.">
<meta property="og:title" content="devin-office — session kanban demo">
<meta property="og:description" content="Session cards on a kanban board move across RUNNING, BLOCKED, REVIEW and CLOSED. Demo mode uses synthetic data.">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg:#0b0e14; --chip:#161b26; --chip-line:#3a4157; --trace:#2a3145;
    --green:#57d98d; --red:#e86a6a; --txt:#e8eaf2; --dim:#7d86a0; --amber:#e8b44a;
    --blue:#6aa9e8;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;
    padding:12px 20px}
  header h1{font-size:15px;font-weight:600;letter-spacing:.4px}
  header h1 a{color:var(--txt);text-decoration:none}
  header h1 a:hover{color:var(--green)}
  header .sub{color:var(--dim);font-size:11px}
  #stat{font-size:11px;color:var(--dim);text-align:right}
  #stat b{color:var(--green);font-weight:600}
  #stat b.bad{color:var(--red)}
  #cols{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;padding:4px 20px 16px;min-height:0}
  .col{background:rgba(22,27,38,.6);border:1px solid var(--chip-line);
    border-radius:10px;display:flex;flex-direction:column;min-height:0}
  .ch{padding:9px 12px;font-size:10px;letter-spacing:1.2px;font-weight:700;
    border-bottom:1px solid var(--trace);display:flex;justify-content:space-between}
  .cards{overflow-y:auto;padding:8px;display:flex;flex-direction:column;
    gap:7px;scrollbar-width:thin;position:relative}
  .card{background:var(--chip);border:1px solid var(--chip-line);
    border-radius:8px;padding:8px 10px;font-size:11px;
    animation:drop .45s cubic-bezier(.16,1,.3,1)}
  @keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}
    to{opacity:1;transform:none}}
  .card .ti{color:var(--txt);font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden}
  .card .mt{color:var(--dim);font-size:9.5px;margin-top:4px;
    display:flex;justify-content:space-between;gap:6px;align-items:center}
  .card .rs{font-size:9px;padding:1px 6px;border-radius:6px;
    border:1px solid var(--chip-line);white-space:nowrap}
  .empty{color:var(--dim);border:1px dashed var(--chip-line);
    border-radius:8px;padding:8px 10px;font-size:10px;font-style:italic}
  .col.running .ch{color:var(--green)} .col.blocked .ch{color:var(--amber)}
  .col.review .ch{color:var(--blue)} .col.closed .ch{color:var(--dim)}
  .col.blocked .card{border-color:#5a4a2a}
  .col.running .card{border-color:#2f4a3a}
  .col.review .card{border-color:#2a3f5a}
  .col.closed .card{opacity:.62}
  #note{position:fixed;bottom:10px;right:20px;font-size:10px;color:var(--dim)}
  #note a{color:var(--dim)}
  @media (max-width:900px){#cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div><h1><a href="https://github.com/Icaro0310/devin-control/tree/main/packages/office">devin-office</a></h1>
    <div class="sub">session kanban · demo, synthetic data</div></div>
  <div id="stat">connecting…</div>
</header>
<div id="cols"></div>
<div id="note">demo com dados simulados · o board real lê <code>/api/state</code> do hub local ·
  <a href="https://github.com/Icaro0310/devin-control/tree/main/packages/office">repo</a></div>
<script>
const $=id=>document.getElementById(id);
const KCOLS=[["running","RUNNING"],["blocked","BLOCKED"],["review","REVIEW"],["closed","CLOSED"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtAge=s=>{if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";
  if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"};

// ── feed simulado: sessões que atravessam o board ──────────────────────
const PROJECTS=["petsaas","living-island","devin-brain","personal-agent-system",
  "Icaro0310.github.io","qwenpaw-suite"];
const MODELS=["swe-2-high","swe-2","swe-1.6"];
const TITLES=[
  "mailbox cycle — process pending .md requests",
  "fix flaky cypress spec (lazy list)",
  "weekly testgen: coverage gaps",
  "session-janitor: sweep empty sessions",
  "fork-janitor dry run",
  "update codemaps for repo graph",
  "qa-pack: regression sweep",
  "djaevin gate calibration",
  "obsidian distill — decisions",
  "deploy gh-pages demo",
  "acp bridge smoke test",
  "follow-up on review comments"];
const REASONS={
  running:["agent turn active","tool call in flight","writing patch","running tests"],
  blocked:["waiting on user","rate limited","needs credentials","ci red"],
  review:["awaiting review","diff ready","tests green","gate passed"],
  closed:["task done","merged","abandoned","superseded"]};
const rnd=a=>a[Math.floor(Math.random()*a.length)];

let SESSIONS=[];   // {id,title,project,model,status,reason,age,born}
let NEXT_ID=1000;
let tick=0;

function spawn(){
  SESSIONS.push({
    id:"s"+(NEXT_ID++),
    title:rnd(TITLES)+" "+NEXT_ID,
    project:rnd(PROJECTS),model:rnd(MODELS),
    status:"running",reason:rnd(REASONS.running),
    age:0,born:tick});
}
function step(){
  tick++;
  for(const s of SESSIONS){
    s.age+=4;
    if(s.status==="closed")continue;
    if(Math.random()<0.16){ // ~16% de chance por tick de mudar de coluna
      if(s.status==="running")
        s.status=Math.random()<0.28?"blocked":"review";
      else if(s.status==="blocked")
        s.status=Math.random()<0.6?"running":"review";
      else if(s.status==="review")
        s.status="closed";
      s.reason=rnd(REASONS[s.status]);
    }
  }
  // população alvo: 4-7 sessões abertas
  const open=SESSIONS.filter(s=>s.status!=="closed").length;
  if(open<5&&Math.random()<0.5)spawn();
  // limpa closed muito antigas p/ não crescer sem fim
  if(SESSIONS.length>26)
    SESSIONS=SESSIONS.filter(s=>s.status!=="closed"||tick-s.born<60);
}

function render(){
  let html="";
  for(const [key,label] of KCOLS){
    const cards=SESSIONS.filter(s=>s.status===key);
    html+=`<div class="col ${key}"><div class="ch">${label}<span>${cards.length}</span></div><div class="cards">`;
    for(const s of cards){
      html+=`<div class="card"><div class="ti">${esc(s.title)}</div>`+
        `<div class="mt"><span>${esc(s.project)} · ${esc(s.model)}</span><span>${fmtAge(s.age)}</span></div>`+
        `<div class="mt"><span class="rs">${esc(s.reason)}</span></div></div>`;
    }
    if(!cards.length)html+=`<div class="empty">empty</div>`;
    html+=`</div></div>`;
  }
  $("cols").innerHTML=html;
  const open=SESSIONS.filter(s=>s.status!=="closed").length;
  $("stat").innerHTML=`<b>${open}</b> open · <b>${SESSIONS.length-open}</b> closed`;
}

// seed inicial: board já com vida quando a página abre
for(let i=0;i<5;i++)spawn();
for(const s of SESSIONS){s.age=Math.floor(Math.random()*400)+20}
SESSIONS[0].status="review";SESSIONS[0].reason="tests green";
SESSIONS[1].status="blocked";SESSIONS[1].reason="rate limited";
render();
setInterval(()=>{step();render()},4000);
</script>
</body>
</html>
